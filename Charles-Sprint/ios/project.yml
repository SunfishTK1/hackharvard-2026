# XcodeGen spec for CharlesSprint.xcodeproj. After editing, regenerate with `xcodegen` in ios/.
# Signing and the server URL live in Config/Base.xcconfig (override in Config/Local.xcconfig).
name: CharlesSprint
options:
  bundleIdPrefix: com.velroi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(CHARLES_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CharlesSprint:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Charles Sprint
        CharlesAPIBaseURL: $(CHARLES_API_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CHARLES_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MessagesExtension
  MessagesExtension:
    type: app-extension
    platform: iOS
    sources: [MessagesExtension, Shared]
    info:
      path: MessagesExtension/Info.plist
      properties:
        CFBundleDisplayName: Charles Sprint
        CharlesAPIBaseURL: $(CHARLES_API_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_NAME: CharlesSprintMessages
        PRODUCT_BUNDLE_IDENTIFIER: $(CHARLES_BUNDLE_ID).MessagesExtension
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
