services:
  web:
    build: .
    image: ops-home
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      PUBLIC_URL: https://ops.hackharvard2026.velroi.com
      TRIAL_OPS_API_URL: http://patient-assistant:3012
    mem_limit: 160m
    networks:
      default:
      web:
        aliases: [ops-home]
      clinical-db_default:

networks:
  web:
    external: true
  clinical-db_default:
    external: true
