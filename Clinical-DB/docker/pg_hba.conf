# Who may connect, and how. First matching line wins.
# TYPE   DATABASE  USER      ADDRESS     METHOD

# Unix socket: only reachable from inside the postgres container (docker exec) and the migrate tool.
local    all       all                   trust

# The superuser never logs in over the network.
hostssl  all       postgres  0.0.0.0/0   reject
hostssl  all       postgres  ::/0        reject

# Everyone else: TLS plus a SCRAM password.
hostssl  all       all       0.0.0.0/0   scram-sha-256
hostssl  all       all       ::/0        scram-sha-256

# No unencrypted TCP connections.
host     all       all       0.0.0.0/0   reject
host     all       all       ::/0        reject
