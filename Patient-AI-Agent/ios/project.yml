# XcodeGen spec for Sage.xcodeproj. After editing, regenerate with `xcodegen` in ios/.
# Signing and the server URL live in Config/Base.xcconfig (override in Config/Local.xcconfig).
name: Sage
options:
  bundleIdPrefix: com.velroi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SAGE_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Sage:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sage
        SageBaseURL: $(SAGE_BASE_URL)
        NSFaceIDUsageDescription: Sage uses Face ID to confirm it's you before you sign study forms or open your documents.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGE_BUNDLE_ID)
    dependencies:
      - target: MessagesExtension
  MessagesExtension:
    type: app-extension
    platform: iOS
    sources: [MessagesExtension, Shared]
    info:
      path: MessagesExtension/Info.plist
      properties:
        CFBundleDisplayName: Sage
        SageBaseURL: $(SAGE_BASE_URL)
        NSFaceIDUsageDescription: Sage uses Face ID to confirm it's you before you sign study forms or open your documents.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_NAME: SageMessages
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGE_BUNDLE_ID).MessagesExtension
