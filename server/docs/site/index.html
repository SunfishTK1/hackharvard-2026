<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hackharvard2026 server</title>
<meta name="description" content="How the hackharvard2026 team server is organized and how to deploy to *.hackharvard2026.velroi.com.">
<style>
  :root { --ink: #111; --muted: #555; --line: #ddd; --bg: #fff; --code: #f4f4f4; --accent: #0b57d0; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eee; --muted: #aaa; --line: #333; --bg: #111; --code: #1c1c1c; --accent: #8ab4f8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
  .agents { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 28px; font-size: 15px; }
  .agents code { white-space: nowrap; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 12px; }
  h2 { font-size: 22px; margin: 36px 0 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  h3 { font-size: 18px; margin: 24px 0 8px; }
  a { color: var(--accent); }
  code { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--code); padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
  pre code { padding: 0; background: none; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  @media (max-width: 700px) { table { display: block; overflow-x: auto; } }
  th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: var(--code); }
  blockquote { margin: 16px 0; padding: 4px 16px; border-left: 4px solid var(--line); color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="agents"><b>AI agents:</b> read the rules first: <a href="/AGENTS.md"><code>/AGENTS.md</code></a>
    (<code>curl -s https://hackharvard2026.velroi.com/AGENTS.md</code>). On the server they're at <code>/opt/apps/AGENTS.md</code>.</p>
  {{readFile "README.md" | markdown}}
</main>
</body>
</html>
